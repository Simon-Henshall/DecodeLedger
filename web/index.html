<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DecodeLedger | Analytical Decoding Workspace</title>
  <style>
    :root {
      --ink: #172b3a;
      --muted: #647582;
      --paper: #f2f5f6;
      --panel: #ffffff;
      --teal: #147d78;
      --teal-dark: #0f625f;
      --amber: #c4862d;
      --line: #d8e0e3;
      --soft: #eef3f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--paper);
      background-image: linear-gradient(rgba(20, 125, 120, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 125, 120, .035) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'Aptos', 'Segoe UI', sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 56px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0 0 9px;
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1;
      letter-spacing: 0;
      font-weight: 650;
    }

    .subtitle {
      max-width: 560px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      flex: 0 0 auto;
      border: 1px solid var(--teal);
      border-radius: 6px;
      color: var(--teal-dark);
      background: #e1f0ef;
      font-size: 18px;
      font-weight: 750;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 20px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(23, 43, 58, .06);
    }

    .input-panel {
      padding: 24px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 208px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #b9c8cc;
      border-radius: 4px;
      color: var(--ink);
      background: #fbfcfc;
      font: 18px/1.5 'Aptos', 'Segoe UI', sans-serif;
      outline: none;
    }

    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(20, 125, 120, .12);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .limit {
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--muted);
      font: 700 13px 'Aptos', 'Segoe UI', sans-serif;
      cursor: pointer;
    }

    .tab:hover {
      border-color: var(--teal);
      color: var(--teal-dark);
    }

    .tab.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #ffffff;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #b9c8cc;
      border-radius: 4px;
      color: var(--ink);
      background: #fbfcfc;
      font: 16px/1.5 'Aptos', 'Segoe UI', sans-serif;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(20, 125, 120, .12);
    }

    .hash-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    select,
    button {
      border: 1px solid #aebfc4;
      border-radius: 4px;
      font: 700 13px 'Aptos', 'Segoe UI', sans-serif;
    }

    select {
      margin-left: 6px;
      padding: 9px 30px 9px 10px;
      color: var(--ink);
      background: var(--panel);
    }

    button {
      padding: 11px 17px;
      cursor: pointer;
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
    }

    button:hover {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .results-panel {
      min-height: 300px;
      padding: 24px;
    }

    .results-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .status {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .2px;
    }

    .empty {
      margin-top: 42px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .result {
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
      animation: rise .35s ease both;
    }

    .result:last-child {
      border-bottom: 0;
    }

    .result-meta {
      display: flex;
      justify-content: space-between;
      color: var(--teal-dark);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .plaintext {
      margin: 7px 0 5px;
      font-size: 19px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .score {
      color: var(--muted);
      font-size: 12px;
    }

    .error {
      color: #b33720;
      font-size: 14px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 28px, 600px);
        padding-top: 30px;
      }

      header {
        margin-bottom: 30px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .input-panel,
      .results-panel {
        padding: 20px;
      }

      .mark {
        width: 52px;
        height: 52px;
        font-size: 15px;
      }

      .controls {
        align-items: flex-start;
        flex-direction: column;
      }

      .hash-fields {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <p class="kicker">Analytical decoding workspace</p>
        <h1>DecodeLedger</h1>
        <p class="subtitle">Classical cipher analysis with clear, traceable results.</p>
      </div>
      <div class="mark" aria-label="DecodeLedger" title="DecodeLedger">DL</div>
    </header>
    <nav class="tabs" role="tablist" aria-label="Workspace tools">
      <button class="tab active" id="tab-decode" type="button" role="tab" aria-selected="true">Decode ciphertext</button>
      <button class="tab" id="tab-hash" type="button" role="tab" aria-selected="false">Crack a hash</button>
    </nav>
    <div class="workspace">
      <section class="panel input-panel">
        <form id="decode-form">
          <label for="ciphertext">Ciphertext</label>
          <textarea id="ciphertext" name="ciphertext" placeholder="Paste the coded words here..." autofocus
            required></textarea>
          <div class="controls"><span class="limit">Show <select id="limit" aria-label="Number of results">
                <option value="1">best match</option>
                <option value="5" selected>top 5</option>
                <option value="10">top 10</option>
              </select></span><button id="submit" type="submit">Decode &rarr;</button></div>
        </form>
        <form id="hash-form" hidden>
          <label for="digest">Hash digest</label>
          <input id="digest" name="digest" type="text" placeholder="Paste the hex digest to break..." required>
          <div class="hash-fields">
            <div>
              <label for="algorithm">Algorithm</label>
              <select id="algorithm">
                <option value="" selected>Any supported</option>
                <option value="md5">MD5</option>
                <option value="ntlm">NTLM</option>
                <option value="sha1">SHA-1</option>
                <option value="sha224">SHA-224</option>
                <option value="sha256">SHA-256</option>
                <option value="sha384">SHA-384</option>
                <option value="sha512">SHA-512</option>
                <option value="sha3_224">SHA3-224</option>
                <option value="sha3_256">SHA3-256</option>
                <option value="sha3_384">SHA3-384</option>
                <option value="sha3_512">SHA3-512</option>
                <option value="blake2s">BLAKE2s</option>
                <option value="blake2b">BLAKE2b</option>
              </select>
            </div>
            <div>
              <label for="max-length">Brute force up to</label>
              <select id="max-length" aria-label="Maximum brute-force length">
                <option value="1">1 character</option>
                <option value="2">2 characters</option>
                <option value="3">3 characters</option>
                <option value="4" selected>4 characters</option>
                <option value="5">5 characters</option>
                <option value="6">6 characters</option>
                <option value="7">7 characters</option>
                <option value="8">8 characters</option>
              </select>
            </div>
          </div>
          <div class="controls"><button id="crack-submit" type="submit">Crack hash &rarr;</button></div>
        </form>
      </section>
      <section class="panel results-panel" aria-live="polite">
        <div class="results-heading">
          <h2 id="results-title">Decoded possibilities</h2><span id="status" class="status">Waiting for text</span>
        </div>
        <div id="results" class="empty">Your clearest reading will appear here.</div>
      </section>
    </div>
  </main>
  <script>
    const tabButtons = document.querySelectorAll('.tab');
    const decodeForm = document.querySelector('#decode-form');
    const hashForm = document.querySelector('#hash-form');
    const results = document.querySelector('#results');
    const status = document.querySelector('#status');
    const title = document.querySelector('#results-title');

    tabButtons.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabButtons.forEach((t) => {
          const active = t === tab;
          t.classList.toggle('active', active);
          t.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        const isHash = tab.id === 'tab-hash';
        decodeForm.hidden = isHash;
        hashForm.hidden = !isHash;
        status.textContent = isHash ? 'Waiting for a digest' : 'Waiting for text';
        status.title = '';
        title.textContent = isHash ? 'Recovered plaintext' : 'Decoded possibilities';
        results.className = 'empty';
        results.textContent = isHash ? 'Enter a hash digest to crack.' : 'Your clearest reading will appear here.';
      });
    });

    const input = document.querySelector('#ciphertext');
    const limit = document.querySelector('#limit');
    const submit = document.querySelector('#submit');

    decodeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = 'Working...';
      results.className = 'empty';
      results.textContent = 'Comparing cipher patterns';
      try {
        const response = await fetch('/api/decode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ciphertext: input.value, limit: Number(limit.value) }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        results.className = '';
        results.innerHTML = data.results.map((result, index) => `<article class="result" style="animation-delay: ${index * 45}ms"><div class="result-meta"><span>${result.cipher_name}</span><span>#${index + 1}</span></div><div class="plaintext"></div><div class="score">English confidence ${(result.score * 100).toFixed(0)}% · dictionary confidence ${(result.dictionary_confidence * 100).toFixed(0)}%</div></article>`).join('');
        data.results.forEach((result, index) => { results.children[index].querySelector('.plaintext').textContent = result.plaintext; });
        status.textContent = `${data.results.length} result${data.results.length === 1 ? '' : 's'} · ${data.analysis.primary_cipher}`;
        status.title = data.analysis.hint;
      } catch (error) { results.className = 'error'; results.textContent = error.message; status.textContent = 'Could not decode'; }
      finally { submit.disabled = false; }
    });

    const digestInput = document.querySelector('#digest');
    const algorithm = document.querySelector('#algorithm');
    const maxLength = document.querySelector('#max-length');
    const crackSubmit = document.querySelector('#crack-submit');

    hashForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      crackSubmit.disabled = true;
      status.textContent = 'Working...';
      results.className = 'empty';
      results.textContent = 'Hashing dictionary words';
      try {
        const response = await fetch('/api/hash-crack', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ digest: digestInput.value.trim(), algorithm: algorithm.value, max_length: Number(maxLength.value) }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        if (!Array.isArray(data) || data.length === 0) {
          results.className = 'empty';
          results.textContent = 'No match found in the dictionary or brute-force space.';
          status.textContent = 'No match';
          return;
        }
        results.className = '';
        results.innerHTML = data.map((result, index) => `<article class="result" style="animation-delay: ${index * 45}ms"><div class="result-meta"><span>${result.hash_name}</span><span>${result.method}</span></div><div class="plaintext"></div></article>`).join('');
        data.forEach((result, index) => { results.children[index].querySelector('.plaintext').textContent = result.plaintext; });
        status.textContent = `${data.length} plaintext${data.length === 1 ? '' : 's'} recovered`;
      } catch (error) { results.className = 'error'; results.textContent = error.message; status.textContent = 'Could not crack'; }
      finally { crackSubmit.disabled = false; }
    });
  </script>
</body>

</html>
